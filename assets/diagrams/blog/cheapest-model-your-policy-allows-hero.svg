<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 524" width="820" height="524" font-family="'Inter', system-ui, -apple-system, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
