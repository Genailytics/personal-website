<text x="410.0" y="241.0" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="11.5" fill="#6B5F58">contract - residency - retention - version pin</text>
<text x="410.0" y="258.0" text-anchor="middle" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="10" fill="#3D3929" letter-spacing="0.02em">deny by default</text>
